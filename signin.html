<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Egypt Heritage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="signin.css">
</head>
<body class="signin-page min-vh-100 d-flex justify-content-center align-items-center py-5">
    <section class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="glass-card p-4 p-sm-5 rounded-4 text-center">
                    <div class="glass-icon-box mx-auto mb-3">
                        <i class="bi bi-person-circle fs-2 text-gold"></i>
                    </div>
                    <h2 class="font-headline headline-sm text-white mb-1">Welcome Back</h2>
                    <p class="text-white-50 small mb-4">Sign in to manage your luxury experiences</p>
                    <form id="loginForm" class="d-flex flex-column gap-3 text-start">
                        <div>
                            <label for="email" class="form-label label-md text-uppercase text-white-50" style="font-size: 11px; letter-spacing: 0.1em;">Email</label>
                            <input type="email" name="email" id="email" class="form-control glass-input py-2 fs-6" placeholder="Enter your email" required>
                        </div>
                        <div>
                            <label for="pass" class="form-label label-md text-uppercase text-white-50" style="font-size: 11px; letter-spacing: 0.1em;">Password</label>
                            <input type="password" name="pass" id="pass" class="form-control glass-input py-2 fs-6 mb-2" placeholder="Enter your password" required>
                            <div class="form-check">
                                <input class="form-check-input custom-checkbox" type="checkbox" name="rem" id="rem">
                                <label class="form-check-label text-white-50 small" for="rem">Remember Me?</label>
                            </div>
                        </div>
                        <button type="submit"class="btn btn-luxury-gold w-100 py-2.5 rounded-pill text-uppercase mt-2">Sign In</button>
                    </form>
                    <div class="mt-4 pt-3 border-top border-white border-opacity-10">
                        <span class="text-white-50 small">Don't have account? </span>
                        <a href="signup.html" class="text-gold fw-semibold text-decoration-none hover-gold small">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="signin.js"></script>
</body>
</html>
