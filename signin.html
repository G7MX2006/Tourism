<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card shadow rounded-3 p-4">
                    <h1 class="text-center text-info mb-4">Sign In</h1>

                    <form id="loginForm" novalidate>
                        <!-- Email Input -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter your Email" required id="email">
                        </div>

                      
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Enter your Password" required
                                id="password">
                        </div>

                       
                        <p id="errorMsg" class="text-danger small mt-2 mb-0 text-center"></p>

                       
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-info text-white">Sign In</button>
                        </div>

                     
                        <div class="text-center mt-3">
                            <small class="text-muted">Don't have an account? <a href="signup.html"
                                    class="text-info text-decoration-none">Sign Up</a></small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="signin.js"></script>
</body>

</html>
