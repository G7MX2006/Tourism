<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Egypt Heritage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/signup.css">
</head>

<body class="signin-page min-vh-100 d-flex justify-content-center align-items-center py-2">
    <section class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="glass-card p-3 p-sm-4 rounded-4 text-center">
                    <div class="glass-icon-box mx-auto mb-2" style="width: 50px; height: 50px;">
                        <i class="bi bi-person-circle fs-3 text-gold"></i>
                    </div>
                    <h2 class="font-headline headline-sm text-white mb-0 fs-4">Create Your Account</h2>
                    <p class="text-white-50 small mb-3" style="font-size: 0.8rem;">Sign up and enjoy specific luxury
                        experiences</p>

                    <form id="signupform" class="d-flex flex-column gap-2 text-start">
                        <div>
                            <label for="name" class="form-label label-md text-uppercase text-white-50 mb-1"
                                style="font-size: 10px; letter-spacing: 0.1em;">Full Name</label>
                            <input type="text" name="name" id="name" class="form-control glass-input py-1.5 fs-6"
                                placeholder="Enter your name" required>
                        </div>
                        <div>
                            <label for="email" class="form-label label-md text-uppercase text-white-50 mb-1"
                                style="font-size: 10px; letter-spacing: 0.1em;">Email</label>
                            <input type="email" name="email" id="email" class="form-control glass-input py-1.5 fs-6"
                                placeholder="Enter your email" required>
                        </div>

                        <div class="row g-2">
                            <div class="col-6">
                                <label for="pass" class="form-label label-md text-uppercase text-white-50 mb-1"
                                    style="font-size: 10px; letter-spacing: 0.1em;">Password</label>
                                <input type="password" name="pass" id="pass"
                                    class="form-control glass-input py-1.5 fs-6" placeholder="Password" required>
                            </div>
                            <div class="col-6">
                                <label for="cpass" class="form-label label-md text-uppercase text-white-50 mb-1"
                                    style="font-size: 10px; letter-spacing: 0.1em;">Confirm Password</label>
                                <input type="password" name="cpass" id="cpass"
                                    class="form-control glass-input py-1.5 fs-6" placeholder="Confirm Password"
                                    required>
                            </div>
                        </div>

                        <div class="form-check mt-1">
                            <input class="form-check-input custom-checkbox" type="checkbox" name="rem" id="rem">
                            <label class="form-check-label text-white-50 small" for="rem"
                                style="font-size: 0.8rem;">Remember Me?</label>
                        </div>

                        <button type="submit"
                            class="btn btn-luxury-gold w-100 py-2 rounded-pill text-uppercase mt-1">Sign Up</button>
                    </form>

                    <div class="mt-3 pt-2 border-top border-white border-opacity-10">
                        <span class="text-white-50 small" style="font-size: 0.8rem;">Already have an account? </span>
                        <a href="signin.html" class="text-gold fw-semibold text-decoration-none hover-gold small"
                            style="font-size: 0.8rem;">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/signup.js"></script>
</body>

</html>
